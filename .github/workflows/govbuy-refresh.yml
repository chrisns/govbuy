name: govbuy nightly refresh
# Runs the ingest harness on a schedule (ADR-0006, supersedes ADR-0005).
# Nightly (Mon-Sat) is deterministic-only (GCA + G-Cloud, no LLM, no Anthropic spend). Sunday is
# the full run, including the LLM-based agentic sources (bramble_hub/bloom/ypo/nhs_sbs) - "AI
# things" run weekly, not nightly. workflow_dispatch defaults to deterministic-only; pass
# full=true to exercise the full path on demand.
# Needs repo vars GOVBUY_WIF_PROVIDER + GOVBUY_INGEST_SA, and repo secrets
# GOVBUY_ANTHROPIC_API_KEY + GOVBUY_COMPANIES_HOUSE_API. See docs/adr/0006-scheduled-github-actions-refresh.md.
on:
  schedule:
    - cron: "0 3 * * 1-6" # 03:00 UTC, Mon-Sat: deterministic-only
    - cron: "0 3 * * 0"   # 03:00 UTC, Sun: full run (LLM-based agentic sources)
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full refresh (including LLM agentic sources) instead of deterministic-only"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # required for keyless Workload Identity Federation auth to GCP

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GOVBUY_WIF_PROVIDER }}
          service_account: ${{ vars.GOVBUY_INGEST_SA }}

      - run: pip install ./ingestion

      - name: govbuy-ingest refresh
        run: |
          if [ "${{ github.event.schedule }}" = "0 3 * * 0" ] || [ "${{ github.event.inputs.full }}" = "true" ]; then
            echo "full refresh (LLM agentic sources included)"
            govbuy-ingest refresh
          else
            echo "deterministic-only refresh (GCA + G-Cloud, no LLM spend)"
            govbuy-ingest refresh --operator gca
          fi
        env:
          GCP_PROJECT: govreposcrape
          ANTHROPIC_API_KEY: ${{ secrets.GOVBUY_ANTHROPIC_API_KEY }}
          COMPANIES_HOUSE_API: ${{ secrets.GOVBUY_COMPANIES_HOUSE_API }}

      - name: liveness check
        run: govbuy-ingest liveness
        env:
          GCP_PROJECT: govreposcrape
