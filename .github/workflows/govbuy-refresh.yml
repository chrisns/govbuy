name: govbuy nightly refresh
# Runs the ingest harness on a schedule (ADR-0006, supersedes ADR-0005), then regenerates and
# redeploys the govbuy.run.cns.me site so its "data as of" date and figures never go stale.
# Nightly (Mon-Sat) is deterministic-only (GCA + G-Cloud, no LLM, no Anthropic spend). Sunday is
# the full run, including the LLM-based agentic sources (bramble_hub/bloom/ypo/nhs_sbs) - "AI
# things" run weekly, not nightly. workflow_dispatch defaults to deterministic-only; pass
# full=true to exercise the full path on demand.
# Needs repo vars GOVBUY_WIF_PROVIDER + GOVBUY_INGEST_SA, and repo secret GOVBUY_COMPANIES_HOUSE_API.
# Claude is reached with no stored key: the job's GitHub OIDC token is exchanged for a short-lived
# Anthropic token (Workload Identity Federation), pinned to this repo + this workflow file on main and
# to the govbuy workspace. See docs/adr/0006-scheduled-github-actions-refresh.md and
# docs/adr/0007-anthropic-workload-identity-federation.md.
on:
  schedule:
    - cron: "0 3 * * 1-6" # 03:00 UTC, Mon-Sat: deterministic-only
    - cron: "0 3 * * 0"   # 03:00 UTC, Sun: full run (LLM-based agentic sources)
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full refresh (including LLM agentic sources) instead of deterministic-only"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # required for keyless Workload Identity Federation auth to GCP

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOVBUY_WIF_PROVIDER }}
          service_account: ${{ vars.GOVBUY_INGEST_SA }}

      - run: pip install ./ingestion

      - name: govbuy-ingest refresh
        run: |
          if [ "${{ github.event.schedule }}" = "0 3 * * 0" ] || [ "${{ github.event.inputs.full }}" = "true" ]; then
            echo "full refresh (LLM agentic sources included)"
            govbuy-ingest refresh
          else
            echo "deterministic-only refresh (GCA + G-Cloud, no LLM spend)"
            govbuy-ingest refresh --operator gca
          fi
        env:
          GCP_PROJECT: govreposcrape
          COMPANIES_HOUSE_API: ${{ secrets.GOVBUY_COMPANIES_HOUSE_API }}
          # Anthropic Workload Identity Federation (ids, not secrets). Do NOT set ANTHROPIC_API_KEY:
          # it outranks federation. govbuy_ingest.llm fetches a fresh GitHub OIDC token per exchange.
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_01TwKj6LmHNgt8yyLSEufx9Y
          ANTHROPIC_ORGANIZATION_ID: 5a1ccb40-fac3-4b39-a0ca-20e686975459
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01VjnvwgE5G8wW5vx8oBh8XF
          ANTHROPIC_WORKSPACE_ID: wrkspc_01GCffBHZvV6oUN9tq8Vm9ep

      - name: liveness check
        run: govbuy-ingest liveness
        env:
          GCP_PROJECT: govreposcrape

      # Site data: rebuild api/public/index.html from the just-refreshed govbuy_public, then
      # redeploy so the live site's "data as of" date and every baked-in figure stay current.
      # Not committed back to git - the deployed image, not the repo, carries the fresh HTML.
      - name: rebuild site
        working-directory: api
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          node scripts/build-site.mjs
        env:
          GCP_PROJECT: govreposcrape

      - name: deploy govbuy-mcp
        run: |
          gcloud run deploy govbuy-mcp --source ./api \
            --project=govreposcrape --region=europe-west1 \
            --service-account=govbuy-api@govreposcrape.iam.gserviceaccount.com \
            --allow-unauthenticated --memory=512Mi --cpu=1 \
            --min-instances=0 --max-instances=1 --session-affinity --timeout=60 \
            --set-env-vars="GCP_PROJECT=govreposcrape,BQ_PUBLIC_DATASET=govbuy_public,BQ_LOCATION=EU,MAX_BYTES_BILLED=2147483648,COMPANIES_HOUSE_API=${{ secrets.GOVBUY_COMPANIES_HOUSE_API }}" \
            --quiet

      # `gcloud run deploy` does not clear a manual traffic pin (e.g. left by a rollback), so the new
      # revision can be created and "deployed" while users keep getting an old one. Always route to latest.
      - name: route traffic to the new revision
        run: |
          gcloud run services update-traffic govbuy-mcp \
            --project=govreposcrape --region=europe-west1 --to-latest --quiet

      - name: verify the live site serves today's data
        run: |
          today=$(date -u +%F)
          for i in 1 2 3 4 5; do
            live=$(curl -fsS https://govbuy.run.cns.me/ | grep -o -E 'data as of <span class="numeral">[0-9-]+' | head -1 | grep -o -E '[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
            echo "live data-as-of: ${live:-none} (expected $today)"
            [ "$live" = "$today" ] && exit 0
            sleep 15
          done
          echo "::error::govbuy.run.cns.me does not serve $today data - the deploy is not live"
          exit 1
