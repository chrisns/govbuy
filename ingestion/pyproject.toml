[project]
name = "govbuy-ingest"
version = "0.1.0"
description = "govbuy agentic ingestion harness (frontier walk + LLM extract/verify + verbatim-substring gate + CH matcher + BigQuery loader)"
requires-python = ">=3.11"
dependencies = [
  "google-cloud-bigquery>=3.25.0",
  "httpx>=0.27.0",
  "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
govbuy-ingest = "govbuy_ingest.__main__:main"
